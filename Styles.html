<style>
    :root {
        --primary: #1a73e8;
        --primary-hover: #1765cc;
        --on-primary: #ffffff;
        --surface: #ffffff;
        --background: #ffffff;
        --background-alt: #f8f9fa;
        --outline: #dadce0;
        --on-surface: #202124;
        --on-surface-variant: #5f6368;
        --error: #d93025;
        --success: #1e8e3e;
        --radius: 8px;
        --radius-sm: 4px;
        --shadow-sm: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    }

    /* Désactivation du mode sombre automatique pour rester homogène avec Sheets */
    /* Si besoin, on peut réactiver un mode sombre plus doux plus tard */


    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Google Sans', Roboto, Arial, sans-serif;
        background: var(--background);
        padding: 16px;
        color: var(--on-surface);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    .card {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 16px;
        border: 1px solid var(--outline);
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    h2 {
        color: var(--on-surface);
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    label {
        font-size: 13px;
        color: var(--on-surface);
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
    }

    select, input[type="text"], input[type="date"] {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        margin-bottom: 16px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--outline);
        background: var(--surface);
        color: var(--on-surface);
        font-size: 14px;
        font-family: inherit;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        outline: none;
    }

    select:hover, input[type="text"]:hover, input[type="date"]:hover {
        border-color: var(--on-surface-variant);
    }

    select:focus, input[type="text"]:focus, input[type="date"]:focus {
        border-color: var(--primary);
        border-width: 2px;
        padding: 0 11px; /* Adjust for border width change */
    }

    .btn {
        width: 100%;
        height: 36px;
        border-radius: 18px;
        border: none;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        font-size: 14px;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 0 24px;
        user-select: none;
    }

    .btn-primary {
        background: var(--primary);
        color: var(--on-primary);
        box-shadow: none;
    }

    .btn-primary:hover:not(:disabled) {
        background: var(--primary-hover);
        box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
    }

    .btn-primary:active:not(:disabled) {
        box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
    }

    .btn-danger {
        background: transparent;
        color: var(--error);
        border: 1px solid var(--outline);
    }

    .btn-danger:hover:not(:disabled) {
        background: #fce8e6;
        border-color: #fce8e6;
    }

    @media (prefers-color-scheme: dark) {
        .btn-danger:hover:not(:disabled) {
            background: rgba(242, 139, 130, 0.15);
            border-color: transparent;
        }
    }

    .btn:disabled {
        opacity: 0.38;
        cursor: not-allowed;
        pointer-events: none;
    }

    kbd {
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--background);
        border: 1px solid var(--outline);
        color: var(--on-surface-variant);
        font-size: 11px;
        font-family: 'Roboto Mono', monospace;
        vertical-align: middle;
    }

    .loading-container {
        display: none;
        justify-content: center;
        align-items: center;
        margin: 16px 0;
    }

    .spinner {
        border: 2px solid var(--outline);
        border-top: 2px solid var(--primary);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 
        0% { transform: rotate(0deg); } 
        100% { transform: rotate(360deg); } 
    }

    #message {
        margin-top: 12px;
        text-align: center;
        font-size: 13px;
        min-height: 1.5em;
    }

    p, li {
        font-size: 13px;
        line-height: 1.6;
        color: var(--on-surface-variant);
        margin-bottom: 8px;
    }

    strong {
        font-weight: 500;
        color: var(--on-surface);
    }

    a {
        color: var(--primary);
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .code-block {
        background-color: var(--background);
        border: 1px solid var(--outline);
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        font-family: 'Roboto Mono', monospace;
        color: var(--on-surface);
        display: block;
        margin: 12px 0;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
    }

    /* Custom Scrollbar for a cleaner look */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: var(--outline);
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: var(--on-surface-variant);
    }

    .dropdown-container, .date-container {
        display: flex;
        flex-direction: column;
        margin-bottom: 8px;
    }

    /* Animation for messages */
    .fade-in {
        animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
