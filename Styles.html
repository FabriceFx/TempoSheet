<style>
    :root {
        --primary: #1a73e8;
        --on-primary: #fff;
        --surface: #f8f9fa;
        --surface-variant: #ffffff;
        --outline: #dadce0;
        --on-surface: #202124;
        --error: #d93025;
        --success: #1e8e3e;
        --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --primary: #8ab4f8;
            --on-primary: #202124;
            --surface: #202124;
            --surface-variant: #292a2d;
            --outline: #5f6368;
            --on-surface: #e8eaed;
            --error: #f28b82;
            --success: #81c995;
        }
        select, input[type="date"] {
            color-scheme: dark;
        }
    }

    * {
        box-sizing: border-box;
        margin: 0;
    }

    body {
        font-family: 'Google Sans', Arial, sans-serif;
        background: var(--surface);
        padding: 16px;
        color: var(--on-surface);
    }

    .card {
        background: var(--surface-variant);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
        border: 1px solid var(--outline);
    }

    h2 {
        color: var(--primary);
        font-size: 18px;
        font-weight: 500;
        margin-top: 0;
        margin-bottom: 12px;
    }

    label {
        font-size: 12px;
        color: var(--on-surface);
        margin-left: 2px;
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
    }

    select, input[type="text"], input[type="date"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 16px;
        border-radius: 8px;
        border: 1px solid var(--outline);
        background: var(--surface);
        color: var(--on-surface);
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.2s;
        outline: none;
    }

    select:focus, input[type="text"]:focus, input[type="date"]:focus {
        border-color: var(--primary);
    }

    .btn {
        width: 100%;
        height: 48px;
        border-radius: 24px;
        border: none;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        font-size: 14px;
        transition: background 0.2s;
    }

    .btn-primary {
        background: var(--primary);
        color: var(--on-primary);
    }

    .btn-primary:hover:not(:disabled) {
        opacity: 0.9;
    }

    .btn-danger {
        background: var(--error);
        color: white;
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    kbd {
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--outline);
        color: var(--surface);
        font-size: 10px;
        font-family: monospace;
    }

    .loading-container {
        display: none;
        justify-content: center;
        align-items: center;
        margin-top: 16px;
    }

    .spinner {
        border: 3px solid var(--outline);
        border-top: 3px solid var(--primary);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #message {
        margin-top: 12px;
        text-align: center;
        font-size: 13px;
    }

    p, li {
        font-size: 14px;
        line-height: 1.6;
        color: var(--on-surface);
        opacity: 0.9;
    }

    strong {
        font-weight: 500;
        color: var(--on-surface);
        opacity: 1;
    }

    a {
        color: var(--primary);
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .code-block {
        background-color: var(--surface);
        border: 1px solid var(--outline);
        padding: 8px 12px;
        border-radius: 6px;
        font-family: monospace;
        color: var(--on-surface);
        display: inline-block;
        margin-top: 8px;
        font-size: 13px;
    }

    .dropdown-container, .date-container {
        display: flex;
        flex-direction: column;
        margin-bottom: 16px;
    }
</style>
