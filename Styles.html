<style>
    /*
     * Jeu de tokens Google Material 3, accent vert Sheets.
     *
     * Principe directeur : un panneau latéral Google Sheets est PLAT et BLANC.
     * Pas de cartes flottantes (bordure + ombre + coins arrondis sur fond gris),
     * qui font ressembler l'extension à un tableau de bord web. Le rythme vient
     * des sections et de leurs séparateurs.
     */
    :root {
        /* Accent : vert produit Google Sheets */
        --primary: #137333;
        --primary-hover: #0d652d;
        --on-primary: #ffffff;
        --primary-container: #e6f4ea;
        --on-primary-container: #0d652d;

        /* Surfaces */
        --surface: #ffffff;
        --surface-container: #f0f4f9;
        --surface-hover: rgba(31, 31, 31, 0.06);

        /* Contenus */
        --on-surface: #1f1f1f;
        --on-surface-variant: #444746;
        --outline: #747775;
        --outline-variant: #c4c7c5;

        /* États */
        --error: #b3261e;
        --error-container: #fce8e6;
        --success: #137333;
        --warning: #a6660a;
        --warning-container: #fef7e0;
        --warning-outline: #f9ab00;

        --radius: 8px;
        --radius-sm: 4px;
        --radius-pill: 20px;

        /*
         * Thème clair uniquement, pour rester aligné sur l'interface blanche de
         * Google Sheets. Une barre latérale est une iframe isolée : elle ne peut
         * pas lire le thème de Sheets, seulement celui du système — une palette
         * sombre s'afficherait donc dans un tableur resté blanc.
         *
         * color-scheme est indispensable ici : sans lui, un système en mode
         * sombre force le rendu natif sombre des <select> et <input type="date">,
         * qui trancheraient sur le reste du panneau.
         */
        color-scheme: light;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Google Sans', Roboto, Arial, sans-serif;
        background: var(--surface);
        color: var(--on-surface);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    /* ---- Structure du panneau ---------------------------------------- */

    .section {
        padding: 16px;
        border-bottom: 1px solid var(--outline-variant);
    }

    .section:last-of-type {
        border-bottom: none;
    }

    h2 {
        font-size: 16px;
        font-weight: 500;
        color: var(--on-surface);
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .subtitle {
        font-size: 13px;
        color: var(--on-surface-variant);
        margin-bottom: 16px;
    }

    /* ---- Barre de progression indéterminée (signature Workspace) ------ */

    .progress {
        position: sticky;
        top: 0;
        z-index: 2;
        height: 3px;
        background: var(--primary-container);
        overflow: hidden;
        visibility: hidden;
    }

    .progress.is-active {
        visibility: visible;
    }

    .progress::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--primary);
        transform-origin: left center;
        animation: indeterminate 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes indeterminate {
        0%   { transform: translateX(-100%) scaleX(0.4); }
        50%  { transform: translateX(20%)   scaleX(0.6); }
        100% { transform: translateX(100%)  scaleX(0.4); }
    }

    /* ---- Champs de saisie -------------------------------------------- */

    label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--on-surface-variant);
        margin-bottom: 6px;
    }

    select,
    input[type="text"],
    input[type="date"] {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        margin-bottom: 16px;
        border: 1px solid var(--outline);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--on-surface);
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
    }

    select:hover,
    input[type="text"]:hover,
    input[type="date"]:hover {
        border-color: var(--on-surface);
    }

    /* box-shadow plutôt qu'une bordure épaissie : évite de décaler le contenu
       du champ au focus. */
    select:focus,
    input[type="text"]:focus,
    input[type="date"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 1px var(--primary);
    }

    ::placeholder {
        color: var(--on-surface-variant);
        opacity: 0.7;
    }

    /* ---- Boutons ------------------------------------------------------ */

    .btn {
        width: 100%;
        min-height: 40px;
        padding: 0 24px;
        border: none;
        border-radius: var(--radius-pill);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        user-select: none;
        transition: background-color 0.15s, box-shadow 0.15s;
    }

    .btn-filled {
        background: var(--primary);
        color: var(--on-primary);
    }

    .btn-filled:hover:not(:disabled) {
        background: var(--primary-hover);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
    }

    .btn-tonal {
        background: var(--primary-container);
        color: var(--on-primary-container);
    }

    .btn-tonal:hover:not(:disabled) {
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .btn-text {
        background: transparent;
        color: var(--primary);
        padding: 0 12px;
    }

    .btn-text:hover:not(:disabled) {
        background: var(--surface-hover);
    }

    .btn-danger {
        background: transparent;
        color: var(--error);
        padding: 0 12px;
    }

    .btn-danger:hover:not(:disabled) {
        background: var(--error-container);
    }

    .btn:disabled {
        opacity: 0.38;
        cursor: default;
        pointer-events: none;
    }

    /* Anneau de focus visible uniquement au clavier. */
    .btn:focus-visible,
    select:focus-visible,
    input:focus-visible,
    a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }

    .btn-row .btn {
        width: auto;
        flex: 1;
    }

    /* ---- Messages ----------------------------------------------------- */

    /* Hauteur réservée : le message n'apparaît plus en poussant le contenu. */
    .msg {
        margin-top: 12px;
        min-height: 20px;
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
        color: var(--on-surface-variant);
    }

    .msg.is-error   { color: var(--error); }
    .msg.is-success { color: var(--success); }

    /* ---- Bandeau d'alerte (chronomètre oublié) ------------------------ */

    .alert {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid var(--warning-outline);
        border-radius: var(--radius);
        background: var(--warning-container);
    }

    .alert p {
        margin-bottom: 12px;
        font-size: 13px;
        color: var(--on-surface);
    }

    /* ---- Éléments de contenu ------------------------------------------ */

    p, li {
        font-size: 13px;
        line-height: 1.6;
        color: var(--on-surface-variant);
        margin-bottom: 8px;
    }

    strong {
        font-weight: 500;
        color: var(--on-surface);
    }

    a {
        color: var(--primary);
        text-decoration: none;
        border-radius: 2px;
    }

    a:hover {
        text-decoration: underline;
    }

    .icon {
        width: 18px;
        height: 18px;
        fill: currentColor;
        flex-shrink: 0;
    }

    kbd {
        padding: 2px 6px;
        border: 1px solid var(--outline-variant);
        border-radius: var(--radius-sm);
        background: var(--surface-container);
        color: var(--on-surface-variant);
        font-family: 'Roboto Mono', monospace;
        font-size: 11px;
        vertical-align: middle;
    }

    .code-block {
        display: block;
        margin: 12px 0;
        padding: 8px 12px;
        border: 1px solid var(--outline-variant);
        border-radius: var(--radius-sm);
        background: var(--surface-container);
        color: var(--on-surface);
        font-family: 'Roboto Mono', monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
    }

    /* ---- Barre de défilement fine, à la Google ------------------------ */

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
        background: var(--outline-variant);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--outline); }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }
</style>
