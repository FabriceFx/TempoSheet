<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <?!= include('Styles') ?>
    <style>
        #timer {
            font-size: 42px;
            font-weight: 500;
            margin: 16px 0;
            color: var(--primary);
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="timer">00:00:00</div>
        <div style="text-align:center; margin-bottom: 8px; font-size: 11px; color: var(--outline);">
            <kbd data-i18n="timerKbKey">Espace</kbd> <span data-i18n="timerKbSpace">Démarrer / Arrêter</span>
        </div>
    </div>

    <div class="card">
        <label for="agendaList" data-i18n="timerAgendaLabel">Agenda cible</label>
        <select id="agendaList">
            <option value="" data-i18n="loading">Chargement...</option>
        </select>

        <label for="projectName" data-i18n="timerProjectLabel">Nom du projet</label>
        <input type="text" id="projectName" placeholder="Ex : Marketing" data-i18n-placeholder="timerProjectPlaceholder">

        <label for="taskDescription" data-i18n="timerTaskLabel">Description de la tâche</label>
        <input type="text" id="taskDescription" placeholder="(Optionnelle)" data-i18n-placeholder="timerTaskPlaceholder">

        <button id="startButton" class="btn btn-primary">
            <span id="btnIcon"></span>
            <span id="btnText" data-i18n="timerStart">Démarrer</span>
        </button>
        <div class="loading-container" id="loadingIndicator">
            <div class="spinner"></div>
        </div>
        <div id="message"></div>
    </div>

<script>
    var startTime;
    var timerInterval;

    // Libellés fournis par le serveur (I18n.gs), source de vérité unique.
    var T = {};

    // Icônes SVG inline : évite de charger la police Material Icons pour deux glyphes.
    var ICONE_PLAY = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    var ICONE_STOP = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>';

    function appliquerTextes(textes) {
        T = textes;
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var valeur = textes[el.getAttribute('data-i18n')];
            if (valeur) el.textContent = valeur;
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
            var valeur = textes[el.getAttribute('data-i18n-placeholder')];
            if (valeur) el.placeholder = valeur;
        });
        // Le libellé du bouton dépend de l'état courant du chronomètre.
        majBouton(!!timerInterval);
    }

    /** Bascule l'apparence du bouton entre « Démarrer » et « Arrêter ». */
    function majBouton(enCours) {
        var btn = document.getElementById('startButton');
        document.getElementById('btnIcon').innerHTML = enCours ? ICONE_STOP : ICONE_PLAY;
        document.getElementById('btnText').textContent =
            (enCours ? T.timerStop : T.timerStart) || (enCours ? 'Arrêter' : 'Démarrer');
        btn.classList.toggle('btn-danger', enCours);
        btn.classList.toggle('btn-primary', !enCours);
    }

    function formatTime(elapsedTime) {
        var hours = Math.floor(elapsedTime / 3600000);
        var minutes = Math.floor((elapsedTime % 3600000) / 60000);
        var seconds = Math.floor(((elapsedTime % 3600000) % 60000) / 1000);

        return (hours < 10 ? "0" + hours : hours) + ":" +
               (minutes < 10 ? "0" + minutes : minutes) + ":" +
               (seconds < 10 ? "0" + seconds : seconds);
    }

    function updateTimer() {
        document.getElementById('timer').textContent = formatTime(new Date() - startTime);
    }

    function toggleLoading(show) {
        document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
        document.getElementById('startButton').style.display = show ? 'none' : 'flex';
    }

    function showMessage(msg, isError) {
        var msgDiv = document.getElementById('message');
        msgDiv.textContent = msg || '';
        msgDiv.style.color = isError ? 'var(--error)' : 'var(--success)';
        msgDiv.classList.add('fade-in');
        setTimeout(function () {
            msgDiv.textContent = '';
            msgDiv.classList.remove('fade-in');
        }, 5000);
    }

    function handleStartStop() {
        var agendaId = document.getElementById('agendaList').value;
        var projectName = document.getElementById('projectName').value.trim();
        var taskDescription = document.getElementById('taskDescription').value.trim();

        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
            majBouton(false);
            toggleLoading(true);

            var endTime = new Date();

            google.script.run
                .withSuccessHandler(function (response) {
                    toggleLoading(false);
                    showMessage(response, false);
                    document.getElementById('projectName').value = '';
                    document.getElementById('taskDescription').value = '';
                    document.getElementById('timer').textContent = '00:00:00';
                })
                .withFailureHandler(function (error) {
                    // L'enregistrement a échoué : on relance le chronomètre pour
                    // ne pas perdre le temps déjà écoulé.
                    toggleLoading(false);
                    showMessage(T.errPrefix + error.message, true);
                    timerInterval = setInterval(updateTimer, 1000);
                    majBouton(true);
                })
                .creerEvenementDansAgenda(agendaId, projectName, taskDescription, startTime.toISOString(), endTime.toISOString());

        } else {
            if (!projectName) {
                showMessage(T.errProject, true);
                return;
            }
            if (!agendaId) {
                showMessage(T.errCalendar, true);
                return;
            }

            startTime = new Date();
            timerInterval = setInterval(updateTimer, 1000);
            majBouton(true);
            document.getElementById('message').textContent = '';

            google.script.run.saveTimerState(agendaId, projectName, taskDescription, startTime.toISOString());
        }
    }

    document.getElementById('startButton').addEventListener('click', handleStartStop);

    document.addEventListener('keydown', function (e) {
        if (e.code === 'Space') {
            var tag = document.activeElement.tagName;
            if (tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') {
                e.preventDefault();
                handleStartStop();
            }
        }
    });

    function chargerAgendas() {
        google.script.run
            .withSuccessHandler(function (agendas) {
                var select = document.getElementById('agendaList');
                select.innerHTML = '';
                agendas.forEach(function (agenda) {
                    var option = document.createElement('option');
                    option.value = agenda.id;
                    option.textContent = agenda.nom;
                    select.appendChild(option);
                });
                verifierEtatChronometre();
            })
            .withFailureHandler(function () {
                showMessage(T.errLoadCalendars, true);
            })
            .obtenirCalendriers();
    }

    function verifierEtatChronometre() {
        google.script.run.withSuccessHandler(function (state) {
            if (!state.isRunning) return;

            var select = document.getElementById('agendaList');
            select.value = state.agendaId;
            // L'agenda mémorisé peut avoir été supprimé ou ne plus être partagé :
            // sans ce garde-fou, l'arrêt du chronomètre échouerait silencieusement.
            if (select.value !== state.agendaId) {
                var manquant = document.createElement('option');
                manquant.value = state.agendaId;
                manquant.textContent = state.agendaId;
                select.insertBefore(manquant, select.firstChild);
                select.value = state.agendaId;
            }

            document.getElementById('projectName').value = state.projectName;
            document.getElementById('taskDescription').value = state.taskDescription;

            startTime = new Date(state.startTime);
            timerInterval = setInterval(updateTimer, 1000);
            majBouton(true);
            updateTimer();
        }).getTimerState();
    }

    window.onload = function () {
        majBouton(false);
        google.script.run
            .withSuccessHandler(function (textes) {
                appliquerTextes(textes);
                chargerAgendas();
            })
            .withFailureHandler(chargerAgendas)
            .getTextesUI();
    };
</script>
</body>
</html>
