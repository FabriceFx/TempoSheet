<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <?!= include('Styles') ?>
    <style>
        p {
            font-size: 13px;
            color: var(--on-surface);
            opacity: 0.8;
            margin-bottom: 24px;
        }

        .btn {
            background: var(--primary);
            color: var(--on-primary);
            margin-top: 16px;
        }

        .btn:hover:not(:disabled) {
            opacity: 0.9;
        }

        #message {
            color: var(--error);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="lblTitle">Générer un rapport</h2>
        <p id="lblSubtitle">Sélectionnez un calendrier et une période pour créer votre feuille de temps.</p>
        
        <div class="dropdown-container">
            <label for="calendrierSelectionne" id="lblCalendar">Calendrier source</label>
            <select id="calendrierSelectionne">
                <option value="">Chargement...</option>
            </select>
        </div>
        
        <div class="dropdown-container">
            <label for="periodeExtraction" id="lblPeriod">Période</label>
            <select id="periodeExtraction" onchange="toggleCustomDateFields()">
                <option value="cetteSemaine" id="optThisWeek">Cette semaine</option>
                <option value="laSemaineDerniere" id="optLastWeek">La semaine dernière</option>
                <option value="ceMois" id="optThisMonth">Ce mois</option>
                <option value="leDernierMois" id="optLastMonth">Le mois dernier</option>
                <option value="cetteAnnee" id="optThisYear">Cette année</option>
                <option value="periodeSpecifiee" id="optCustom">Période spécifiée</option>
            </select>
        </div>
        
        <div id="customDateFields" style="display:none;">
            <div class="date-container">
                <label for="dateDebut" id="lblStart">Date de début</label>
                <input type="date" id="dateDebut">
            </div>
            <div class="date-container">
                <label for="dateFin" id="lblEnd">Date de fin</label>
                <input type="date" id="dateFin">
            </div>
        </div>
        
        <button id="btnCreer" class="btn">
            <span class="material-icons-round">description</span>
            <span id="btnText">Créer le rapport</span>
        </button>
        <div class="loading-container" id="loadingIndicator">
            <div class="spinner"></div>
        </div>
        <div id="message"></div>
    </div>

    <script>
        var lang = 'fr';
        
        const i18n = {
            fr: {
                title: 'Générer un rapport',
                subtitle: 'Sélectionnez un calendrier et une période pour créer votre feuille de temps.',
                calendar: 'Calendrier source',
                loading: 'Chargement...',
                period: 'Période',
                thisWeek: 'Cette semaine',
                lastWeek: 'La semaine dernière',
                thisMonth: 'Ce mois',
                lastMonth: 'Le mois dernier',
                thisYear: 'Cette année',
                custom: 'Période spécifiée',
                start: 'Date de début',
                end: 'Date de fin',
                btnCreate: 'Créer le rapport',
                errCal: 'Veuillez sélectionner un calendrier.',
                errDates: 'Veuillez spécifier les dates de début et de fin.',
                errLoad: 'Erreur de chargement des calendriers.',
                error: 'Erreur : '
            },
            en: {
                title: 'Generate Report',
                subtitle: 'Select a calendar and a period to create your timesheet.',
                calendar: 'Source Calendar',
                loading: 'Loading...',
                period: 'Period',
                thisWeek: 'This week',
                lastWeek: 'Last week',
                thisMonth: 'This month',
                lastMonth: 'Last month',
                thisYear: 'This year',
                custom: 'Custom period',
                start: 'Start Date',
                end: 'End Date',
                btnCreate: 'Create Report',
                errCal: 'Please select a calendar.',
                errDates: 'Please specify start and end dates.',
                errLoad: 'Error loading calendars.',
                error: 'Error: '
            }
        };

        function translateApp() {
            const t = i18n[lang];
            document.getElementById('lblTitle').textContent = t.title;
            document.getElementById('lblSubtitle').textContent = t.subtitle;
            document.getElementById('lblCalendar').textContent = t.calendar;
            document.getElementById('lblPeriod').textContent = t.period;
            document.getElementById('optThisWeek').textContent = t.thisWeek;
            document.getElementById('optLastWeek').textContent = t.lastWeek;
            document.getElementById('optThisMonth').textContent = t.thisMonth;
            document.getElementById('optLastMonth').textContent = t.lastMonth;
            document.getElementById('optThisYear').textContent = t.thisYear;
            document.getElementById('optCustom').textContent = t.custom;
            document.getElementById('lblStart').textContent = t.start;
            document.getElementById('lblEnd').textContent = t.end;
            document.getElementById('btnText').textContent = t.btnCreate;
            
            var option = document.querySelector('#calendrierSelectionne option[value=""]');
            if(option) option.textContent = t.loading;
        }

        function initLang() {
            google.script.run.withSuccessHandler(function(l) {
                lang = (l === 'en') ? 'en' : 'fr';
                translateApp();
            }).getUserLanguage();
        }

        function toggleCustomDateFields() {
            var selection = document.getElementById('periodeExtraction').value;
            var customDateFields = document.getElementById('customDateFields');
            if (selection === 'periodeSpecifiee') {
                customDateFields.style.display = 'block';
            } else {
                customDateFields.style.display = 'none';
            }
        }

        function toggleLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
            document.getElementById('btnCreer').style.display = show ? 'none' : 'flex';
        }

        function showMessage(msg) {
            var msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.classList.add('fade-in');
            setTimeout(function() { 
                msgDiv.textContent = ''; 
                msgDiv.classList.remove('fade-in');
            }, 5000);
        }

        window.onload = function() {
            initLang();
            
            google.script.run
                .withSuccessHandler(function(calendriers) {
                    var select = document.getElementById('calendrierSelectionne');
                    select.innerHTML = '';
                    calendriers.forEach(function(calendrier) {
                        var option = document.createElement('option');
                        option.value = calendrier.id;
                        option.textContent = calendrier.nom;
                        select.appendChild(option);
                    });
                })
                .withFailureHandler(function(error) {
                    showMessage(i18n[lang].errLoad);
                })
                .obtenirCalendriers();

            document.getElementById('btnCreer').onclick = function() {
                const t = i18n[lang];
                var selectedCalendarId = document.getElementById('calendrierSelectionne').value;
                var selectedPeriod = document.getElementById('periodeExtraction').value;
                var dateDebut = '';
                var dateFin = '';
                
                if (!selectedCalendarId) {
                    showMessage(t.errCal);
                    return;
                }

                if (selectedPeriod === 'periodeSpecifiee') {
                    dateDebut = document.getElementById('dateDebut').value;
                    dateFin = document.getElementById('dateFin').value;
                    if (!dateDebut || !dateFin) {
                        showMessage(t.errDates);
                        return;
                    }
                }

                toggleLoading(true);

                google.script.run
                    .withSuccessHandler(function() {
                        toggleLoading(false);
                        google.script.host.close();
                    })
                    .withFailureHandler(function(error) {
                        toggleLoading(false);
                        showMessage(t.error + error.message);
                    })
                    .exporterCalendrier(selectedCalendarId, selectedPeriod, dateDebut, dateFin);
            };
        };
    </script>
</body>
</html>
