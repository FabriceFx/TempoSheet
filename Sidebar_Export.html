<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <?!= include('Styles') ?>
</head>
<body>
    <div class="progress" id="progress"></div>

    <div class="section">
        <h2 data-i18n="exportTitle">Générer un rapport</h2>
        <p class="subtitle" data-i18n="exportSubtitle">Sélectionnez un calendrier et une période pour créer votre feuille de temps.</p>

        <label for="calendrierSelectionne" data-i18n="exportCalendarLabel">Calendrier source</label>
        <select id="calendrierSelectionne">
            <option value="" data-i18n="loading">Chargement...</option>
        </select>

        <label for="periodeExtraction" data-i18n="exportPeriodLabel">Période</label>
        <select id="periodeExtraction" onchange="toggleCustomDateFields()">
            <option value="cetteSemaine" data-i18n="periodThisWeek">Cette semaine</option>
            <option value="laSemaineDerniere" data-i18n="periodLastWeek">La semaine dernière</option>
            <option value="ceMois" data-i18n="periodThisMonth">Ce mois</option>
            <option value="leDernierMois" data-i18n="periodLastMonth">Le mois dernier</option>
            <option value="cetteAnnee" data-i18n="periodThisYear">Cette année</option>
            <option value="periodeSpecifiee" data-i18n="periodCustom">Période spécifiée</option>
        </select>

        <div id="customDateFields" style="display:none;">
            <label for="dateDebut" data-i18n="exportStartDate">Date de début</label>
            <input type="date" id="dateDebut">

            <label for="dateFin" data-i18n="exportEndDate">Date de fin</label>
            <input type="date" id="dateFin">
        </div>

        <button id="btnCreer" class="btn btn-filled">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            <span data-i18n="exportBtnCreate">Créer le rapport</span>
        </button>

        <div class="msg" id="message" role="status" aria-live="polite"></div>
    </div>

    <script>
        // Libellés fournis par le serveur (I18n.gs), source de vérité unique.
        // Les valeurs présentes dans le HTML ne servent que d'affichage initial.
        var T = {};
        var messageTimer = null;

        function appliquerTextes(textes) {
            T = textes;
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                var valeur = textes[el.getAttribute('data-i18n')];
                if (valeur) el.textContent = valeur;
            });
        }

        function toggleCustomDateFields() {
            var estPersonnalise = document.getElementById('periodeExtraction').value === 'periodeSpecifiee';
            document.getElementById('customDateFields').style.display = estPersonnalise ? 'block' : 'none';
        }

        /**
         * Barre de progression en haut du panneau plutôt que substitution du
         * bouton par un spinner : la mise en page ne bouge plus pendant l'appel.
         */
        function toggleLoading(actif) {
            document.getElementById('progress').classList.toggle('is-active', actif);
            document.getElementById('btnCreer').disabled = actif;
        }

        function showMessage(msg, type) {
            var el = document.getElementById('message');
            el.textContent = msg || '';
            el.className = 'msg' + (type ? ' is-' + type : '');
            // Sans cette remise à zéro, le minuteur d'un message précédent
            // effacerait prématurément le message courant.
            clearTimeout(messageTimer);
            messageTimer = setTimeout(function () {
                el.textContent = '';
                el.className = 'msg';
            }, 6000);
        }

        function chargerCalendriers() {
            google.script.run
                .withSuccessHandler(function (calendriers) {
                    var select = document.getElementById('calendrierSelectionne');
                    select.innerHTML = '';
                    calendriers.forEach(function (calendrier) {
                        var option = document.createElement('option');
                        option.value = calendrier.id;
                        option.textContent = calendrier.nom;
                        select.appendChild(option);
                    });
                })
                .withFailureHandler(function () {
                    showMessage(T.errLoadCalendars, 'error');
                })
                .obtenirCalendriers();
        }

        document.getElementById('btnCreer').onclick = function () {
            var selectedCalendarId = document.getElementById('calendrierSelectionne').value;
            var selectedPeriod = document.getElementById('periodeExtraction').value;
            var dateDebut = '';
            var dateFin = '';

            if (!selectedCalendarId) {
                showMessage(T.errCalendar, 'error');
                return;
            }

            if (selectedPeriod === 'periodeSpecifiee') {
                dateDebut = document.getElementById('dateDebut').value;
                dateFin = document.getElementById('dateFin').value;
                if (!dateDebut || !dateFin) {
                    showMessage(T.errDates, 'error');
                    return;
                }
            }

            toggleLoading(true);

            google.script.run
                .withSuccessHandler(function () {
                    toggleLoading(false);
                    google.script.host.close();
                })
                .withFailureHandler(function (error) {
                    toggleLoading(false);
                    showMessage(T.errPrefix + error.message, 'error');
                })
                .exporterCalendrier(selectedCalendarId, selectedPeriod, dateDebut, dateFin);
        };

        window.onload = function () {
            google.script.run
                .withSuccessHandler(function (textes) {
                    appliquerTextes(textes);
                    chargerCalendriers();
                })
                .withFailureHandler(chargerCalendriers)
                .getTextesUI();
        };
    </script>
</body>
</html>
